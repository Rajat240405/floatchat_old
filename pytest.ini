# Repo-root pytest configuration.
#
# Running `pytest` from the repository root must behave exactly like running
# it from floatchat/ (the backend directory). This file pins test discovery
# and the src/ import path so results are identical in both supported working
# directories. URL-prefix invocations like `pytest floatchat/tests/...` from
# the root also work because this ini is picked up as the rootdir config.
[pytest]
testpaths = floatchat/tests
pythonpath = floatchat/src
asyncio_mode = auto
filterwarnings =
    ignore:Using.*httpx.*deprecated
