[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "floatchat"
version = "0.1.0"
description = "AI-powered conversational backend for querying live Argo BGC oceanographic data"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "plotly>=5.19.0",
    "netCDF4>=1.6.5",
    "httpx>=0.27.0",
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "tqdm>=4.66.0",
    # Imported by query_engine.engine but previously undeclared (pulled in
    # transitively via pandas). Declared explicitly now.
    "python-dateutil>=2.8.0",
    # Imported by query_normalizer.fallback. Previously an optional, undeclared
    # import with a difflib shim, so behavior differed by environment. The
    # test suite assumes rapidfuzz semantics, so it is now a hard dependency.
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    # Note: httpx is intentionally not repeated here (already a runtime dep,
    # required by FastAPI's TestClient). respx was removed — unused by the
    # test suite (zero imports).
]

[tool.hatch.build.targets.wheel]
packages = ["src/floatchat"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Make the src/ layout importable so the suite runs identically without an
# installed package (e.g. plain `pip install -e .` is no longer a prerequisite
# for running tests from this directory). The repo-root pytest.ini provides
# the equivalent path when running from the repository root.
pythonpath = ["src"]

filterwarnings = [
    "ignore:Using.*httpx.*deprecated",
]
